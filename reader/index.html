<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reader</title>
<script>
// Relative imports need a trailing slash on the directory URL; some proxies
// serve the bare path without redirecting.
if (!location.pathname.endsWith("/") && !location.pathname.endsWith(".html"))
  location.replace(location.pathname + "/" + location.search + location.hash);
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font: 15px/1.5 -apple-system, system-ui, sans-serif;
    max-width: 780px; margin: 0 auto; padding: 24px;
    background: #14161a; color: #e8eaed;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; color: #9aa0a6; }
  textarea {
    width: 100%; min-height: 42vh; padding: 12px; resize: vertical;
    background: #1e2126; color: #e8eaed; border: 1px solid #2f343b;
    border-radius: 8px; font: inherit;
  }
  select, input[type=text] {
    font: inherit; padding: 7px 10px; border-radius: 8px;
    background: #1e2126; color: #e8eaed; border: 1px solid #3a3f47;
  }
  label.ctl { display: inline-flex; align-items: center; gap: 6px; color: #b0b4b9; font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    background: #2a2e35; color: #e8eaed; border: 1px solid #3a3f47;
  }
  button:hover { background: #343941; }
  button.primary { background: #3b6ef5; border-color: #3b6ef5; }
  button.primary:hover { background: #4d7cf7; }
  button.icon { min-width: 44px; font-variant-numeric: tabular-nums; }
  button.round { width: 46px; height: 46px; border-radius: 50%; font-size: 18px; padding: 0; }
  .speeds button.active { background: #3b6ef5; border-color: #3b6ef5; }

  /* compact transport — the default sizes eat a phone screen. Scope to the
     player controls so the composer buttons keep their comfortable hit size. */
  #controls .row { gap: 6px; margin: 7px 0; }
  #controls button { padding: 6px 10px; font-size: 13px; }
  #controls button.icon { min-width: 38px; }
  #controls button.round { width: 38px; height: 38px; font-size: 15px; }
  #controls .speeds { flex-wrap: nowrap; overflow-x: auto; gap: 5px; -webkit-overflow-scrolling: touch; }
  #controls .speeds button { padding: 5px 9px; font-size: 12px; flex: 0 0 auto; }
  .status { color: #9aa0a6; font-size: 13px; min-height: 1.4em; }
  .spacer { flex: 1; }
  .hidden { display: none !important; }
  progress { width: 100%; height: 8px; accent-color: #3b6ef5; }

  /* reading pane — full height, page scrolls, transport pinned below */
  #pane {
    background: #1a1d22; border: 1px solid #2f343b; border-radius: 10px;
    padding: 18px 22px; font-size: 18px; line-height: 1.9;
  }
  #pane h1, #pane h2, #pane h3, #pane h4 { line-height: 1.3; margin: 1em 0 .4em; color: #f0f2f5; }
  #pane h1 { font-size: 1.5em; } #pane h2 { font-size: 1.3em; } #pane h3 { font-size: 1.15em; }
  #pane p { margin: .6em 0; }
  #pane ul, #pane ol { margin: .5em 0; padding-left: 1.6em; }
  #pane li { margin: .2em 0; }
  #pane blockquote { border-left: 3px solid #3a3f47; margin: .6em 0; padding-left: 14px; color: #b0b4b9; }
  #pane hr { border: none; border-top: 1px solid #2f343b; margin: 1em 0; }
  #pane pre.code { background: #0f1114; border: 1px solid #2f343b; border-radius: 8px; padding: 14px; overflow-x: auto; margin: .7em 0; }
  #pane pre.code code { background: none; padding: 0; font: 13px/1.55 ui-monospace, Menlo, monospace; color: #d6dae0; white-space: pre; }
  #pane code { background: #0f1114; border-radius: 4px; padding: 1px 5px; font: .88em ui-monospace, Menlo, monospace; color: #e3c08d; }
  .w { padding: 1px 2px; border-radius: 4px; cursor: pointer; }
  .w:hover { background: #2a2e35; }
  .w.lnk { color: #6ea8ff; text-decoration: underline; }
  .w.cur, .w.cur code, .w.cur strong, .w.cur em { background: #f5c451; color: #14161a; }

  #controls {
    position: sticky; bottom: 0; z-index: 5;
    background: #14161a; border-top: 1px solid #2f343b;
    padding: 10px 0 4px; margin-top: 10px;
  }
  .scrub { width: 100%; margin: 4px 0; accent-color: #3b6ef5; }
  .time { font-variant-numeric: tabular-nums; color: #9aa0a6; font-size: 13px; }
  .transport { justify-content: center; }

  details { margin-top: 18px; color: #9aa0a6; font-size: 13px; }
  details summary { cursor: pointer; }
  #env { background: #1a1d22; border: 1px solid #2f343b; border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
  #env b { color: #e8eaed; }
  #log {
    background: #0f1114; border: 1px solid #2f343b; border-radius: 8px;
    padding: 10px 14px; font: 12px/1.6 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; max-height: 40vh; overflow-y: auto;
    color: #b8bdc4;
  }
</style>
</head>
<body>
  <h1>reader</h1>

  <!-- input view -->
  <div id="composer">
    <textarea id="text" placeholder="Paste text here, or hit “Read clipboard”…"></textarea>
    <div class="row">
      <button id="speak" class="primary">Speak</button>
      <button id="clip">Read clipboard</button>
      <label class="ctl"><input type="checkbox" id="md" checked> Markdown</label>
      <label class="ctl">Voice <select id="voice">
        <option value="af_heart" selected>af_heart</option>
        <option value="af_bella">af_bella</option>
        <option value="af_nicole">af_nicole</option>
        <option value="am_michael">am_michael</option>
        <option value="bf_emma">bf_emma</option>
        <option value="bm_george">bm_george</option>
      </select></label>
      <span class="spacer"></span>
      <span id="status0" class="status"></span>
    </div>
    <div class="row">
      <label class="ctl">Engine <select id="device">
        <option value="cloud">cloud (Unreal Speech)</option>
        <option value="wasm" selected>wasm (on-device)</option>
      </select></label>
      <label class="ctl" id="dtypeCtl">Model <select id="dtype">
        <option value="q8" selected>q8 (92 MB)</option>
        <option value="fp32">fp32 (326 MB)</option>
        <option value="fp16">fp16 (163 MB)</option>
        <option value="q4f16">q4f16 (154 MB)</option>
        <option value="q4">q4 (305 MB)</option>
      </select></label>
      <span class="ctl">downloads once, then cached offline</span>
    </div>
    <progress id="dlbar" max="1" value="0" style="display:none"></progress>
  </div>

  <!-- player view -->
  <div id="reader" class="hidden">
    <div id="pane"></div>

    <div id="controls">
      <input id="scrub" class="scrub" type="range" min="0" max="0" step="0.05" value="0">
      <div class="row">
        <span id="time" class="time">0:00 / 0:00</span>
        <span class="spacer"></span>
        <span id="status" class="status"></span>
      </div>

      <div class="row transport">
        <button id="back15" class="icon" title="Back 15s">« 15</button>
        <button id="back10" class="icon" title="Back 10s">‹ 10</button>
        <button id="replay" class="round" title="Replay this sentence">↺</button>
        <button id="play" class="round primary" title="Play / pause">▶</button>
        <button id="fwd10" class="icon" title="Forward 10s">10 ›</button>
        <button id="fwd30" class="icon" title="Forward 30s">30 »</button>
      </div>

      <div class="row speeds" id="speeds"></div>
      <div class="row">
        <button id="newText">‹ New text</button>
        <button id="stop">Stop</button>
      </div>
    </div>
  </div>

  <details>
    <summary>debug</summary>
    <div id="env">detecting environment…</div>
    <div class="row"><button id="copyLog">Copy debug log</button><span id="copyStatus" class="status"></span></div>
    <div id="log"></div>
  </details>

  <script type="module" src="./app.bundle.js"></script>
</body>
</html>
